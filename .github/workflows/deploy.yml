name: FlexiFit API Production CI/CD

on:
  push:
    branches: [ master ] # Mag run tuwing may push sa master branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Compile and Publish .NET API
      run: dotnet publish "FlexiFit.Api/FlexiFit.Api.csproj" -c Release -r linux-x64 --self-contained true -o ./publish

    - name: Compress Build Artifacts (ZIP)
      run: zip -r publish.zip ./publish/*

    - name: Automated SFTP Upload, Unzip, and Server Restart
      env:
        SSHPASS: '${{ secrets.ALWAYSDATA_SSH_PASSWORD }}'
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -e scp -o StrictHostKeyChecking=no ./publish.zip flexifitapi@ssh-flexifitapi.alwaysdata.net:www/
        sshpass -e ssh -o StrictHostKeyChecking=no flexifitapi@ssh-flexifitapi.alwaysdata.net "cd www && unzip -o publish.zip && rm publish.zip"



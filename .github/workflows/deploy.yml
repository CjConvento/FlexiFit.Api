name: FlexiFit API AlwaysData CI/CD

on:
  push:
    branches: [ master ] # Mag run tuwing may push sa master branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Compile and Publish .NET API

      # Tinanggal ang --self-contained true. Mas maliit (20MB) at mas mabilis ang build.
      # Gumagamit na ang AlwaysData ng .NET 8 Runtime, kaya sapat na ang DLLs lang.
      run: dotnet publish "FlexiFit.Api/FlexiFit.Api.csproj" -c Release -o ./publish

    - name: Compress Build Artifacts (ZIP)

      # Zipping the CONTENTS ng publish folder directly. 
      # Iwas sa nested folder na `www/publish/FlexiFit.Api.dll` sa server.
      run: cd publish && zip -r ../publish.zip .

    - name: Automated SFTP Upload, Unzip, and Cleanup
      env:
        SSHPASS: '${{ secrets.ALWAYSDATA_SSH_PASSWORD }}'
        SSH_USER: 'flexifitapi'
        SSH_HOST: 'ssh-flexifitapi.alwaysdata.net'

      run: |
        sudo apt-get update && sudo apt-get install -y sshpass

        echo "Uploading build artifacts..."
        sshpass -e scp -4 -o StrictHostKeyChecking=no ./publish.zip ${SSH_USER}@${SSH_HOST}:~/

        echo "Extracting files on server..."
        sshpass -e ssh -4 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "cd ~/www && unzip -o ~/publish.zip && rm ~/publish.zip"

        echo "Deployment successful! Files updated in ~/www"


